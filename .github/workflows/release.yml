# Tag-driven release pipeline.
#
# Two design choices that look weird but aren't:
#   1. runs-on: macos-latest. ubuntu-latest hit Bun-on-GHA spawn races
#      and got hit harder by the 2026-05-04 GHA outage; macos-latest
#      run on fb1ee05b (2026-05-04T14:34Z) shipped 10 assets cleanly.
#      `build:platforms` cross-compiles all 5 platforms regardless of
#      runner OS, so user-facing binaries are unaffected by runner choice.
#   2. Release repeats the core gates before signing provenance. CI normally
#      catches failures earlier, but a tag or manual dispatch is a distinct
#      trust event and must prove the exact release checkout passed.
# See `feedback_release_pipeline_chase_root_causes.md` for the v26.5.18
# series cautionary tale.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.888)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    # macos-latest aligns with ci.yml. ubuntu-latest had two separate
    # confirmed failure modes during the v26.5.18 series:
    #   1. Bun's child_process.spawn(cmd, [], {shell:true}) hit
    #      intermittent `ENOENT posix_spawn '/bin/sh'` on GHA shared
    #      ubuntu runners. Reproduced 5x; sister sync probes succeeded
    #      with identical env. Local + Docker oven/bun:latest x64 never
    #      hit it. Bun-on-GHA-runner-specific race.
    #   2. GHA cache/policy update endpoint failures during the
    #      2026-05-04 site-wide incident affected ubuntu pool more
    #      severely than macos.
    # macos-latest run on commit fb1ee05b (2026-05-04T14:34Z) shipped
    # all 10 assets cleanly. Cross-platform binaries are produced by
    # `bun run build:platforms` regardless of runner OS — runner choice
    # only affects publish pipeline reliability, not user-facing binary.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Resolve and validate tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged_commit=$(git rev-list -n 1 "$tag")
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "::error::tag $tag points to $tagged_commit, but this run checked out $GITHUB_SHA"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Verify release source
        run: |
          bun test
          bun run doctor:arch
          bun run smoke

      - name: Build all platform binaries
        run: bun run build:platforms

      - name: Generate CycloneDX SBOM
        env:
          CCB_RELEASE_VERSION: ${{ steps.tag.outputs.tag }}
        run: bun run sbom dist/binaries/ccb-sbom.cdx.json

      - name: Generate SHA256 checksums
        # Sibling .sha256 files alongside each binary. The auto-updater
        # fetches these to verify content integrity before symlink swap.
        run: |
          cd dist/binaries
          for f in ccb-*; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la

      - name: Attest release binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/binaries/ccb-darwin-arm64
            dist/binaries/ccb-darwin-x64
            dist/binaries/ccb-linux-arm64
            dist/binaries/ccb-linux-x64
            dist/binaries/ccb-windows-x64.exe

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/binaries/ccb-darwin-arm64
            dist/binaries/ccb-darwin-x64
            dist/binaries/ccb-linux-arm64
            dist/binaries/ccb-linux-x64
            dist/binaries/ccb-windows-x64.exe
          sbom-path: dist/binaries/ccb-sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/binaries/ccb-darwin-arm64
            dist/binaries/ccb-darwin-arm64.sha256
            dist/binaries/ccb-darwin-x64
            dist/binaries/ccb-darwin-x64.sha256
            dist/binaries/ccb-linux-arm64
            dist/binaries/ccb-linux-arm64.sha256
            dist/binaries/ccb-linux-x64
            dist/binaries/ccb-linux-x64.sha256
            dist/binaries/ccb-windows-x64.exe
            dist/binaries/ccb-windows-x64.exe.sha256
            dist/binaries/ccb-sbom.cdx.json
