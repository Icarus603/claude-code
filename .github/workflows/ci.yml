name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install ripgrep
        # macOS runner image dropped pre-installed rg; verify-dynamic-import-
        # targets / verify-default-import-targets shell out to it.
        run: brew install ripgrep

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        # Biome config lives at biome.json. Pre-commit hook lints staged
        # files only; CI lints the whole tree to catch anything that
        # slipped through PRE_COMMIT_SKIP=1 or was committed pre-V7
        # when the hook's src/ glob was silently dead.
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: doctor:arch (architectural + silent-failure rules)
        run: bun run scripts/doctor-architecture.ts

      - name: smoke (boot + plugin dispatch + live-fire hook spawn)
        run: bun run smoke
