name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.888)'
        required: true

permissions:
  contents: write

jobs:
  build:
    # ubuntu-latest is intentional — ccb users run on macOS, Linux, AND
    # Windows. Surface platform-specific test failures here BEFORE shipping
    # a binary, even if ci.yml only runs macos-latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      # Quality gate: tag-driven releases must NOT bypass the doctor:arch /
      # test gate. CI runs the same checks on every push, but release tags
      # can be cut manually via workflow_dispatch (or pushed without going
      # through CI), so we re-run them here as the last line of defence
      # before publishing a binary that auto-update will push to every
      # `ccb` user. ~30s wall time, single platform — the build:platforms
      # step below is the long pole anyway.
      - name: Install ripgrep
        run: |
          if [ "$(uname)" = "Darwin" ]; then brew install ripgrep
          else sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Probe bun spawn
        # Minimal repro to isolate whether bun's child_process.spawn has
        # an ENOENT race for /bin/sh on GHA ubuntu-latest. If this fails
        # but a sister spawnSync succeeds, the bug is bun-on-GHA, not
        # ccb code.
        run: |
          cat > /tmp/probe.ts <<'EOF'
          import { spawn, spawnSync } from 'child_process'

          // Sync probe — control. Should never fail.
          const sync = spawnSync('/bin/sh', ['-c', 'echo ok-sync'])
          console.log('SYNC: status=' + sync.status + ' stdout=' + sync.stdout?.toString().trim() + ' err=' + (sync.error?.message ?? 'none'))

          // Async probe — same args, but goes through async spawn path.
          await new Promise<void>(resolve => {
            const c = spawn('/bin/sh', ['-c', 'echo ok-async'])
            let stdout = ''
            c.stdout?.on('data', d => stdout += d)
            c.on('error', e => { console.error('ASYNC ERROR: ' + e.message); resolve() })
            c.on('exit', code => { console.log('ASYNC: exit=' + code + ' stdout=' + stdout.trim()); resolve() })
          })

          // Async probe with shell:true (the ccb hook chain pattern).
          await new Promise<void>(resolve => {
            const c = spawn('echo ok-shelltrue', [], { shell: true })
            let stdout = ''
            c.stdout?.on('data', d => stdout += d)
            c.on('error', e => { console.error('SHELL:TRUE ERROR: ' + e.message); resolve() })
            c.on('exit', code => { console.log('SHELL:TRUE: exit=' + code + ' stdout=' + stdout.trim()); resolve() })
          })
          EOF
          bun /tmp/probe.ts

      - name: Test
        run: bun test

      - name: doctor:arch (full)
        run: bun run scripts/doctor-architecture.ts

      - name: smoke
        run: bun run smoke

      - name: Build all platform binaries
        run: bun run build:platforms

      - name: Generate SHA256 checksums
        # Sibling .sha256 files alongside each binary. The auto-updater
        # fetches these to verify content integrity before symlink swap.
        run: |
          cd dist/binaries
          for f in ccb-*; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/binaries/ccb-darwin-arm64
            dist/binaries/ccb-darwin-arm64.sha256
            dist/binaries/ccb-darwin-x64
            dist/binaries/ccb-darwin-x64.sha256
            dist/binaries/ccb-linux-arm64
            dist/binaries/ccb-linux-arm64.sha256
            dist/binaries/ccb-linux-x64
            dist/binaries/ccb-linux-x64.sha256
            dist/binaries/ccb-windows-x64.exe
            dist/binaries/ccb-windows-x64.exe.sha256
