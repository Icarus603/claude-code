name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install ripgrep
        # macOS runner image dropped pre-installed rg; verify-dynamic-import-
        # targets / verify-default-import-targets shell out to it.
        run: brew install ripgrep

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        # Biome config lives at biome.json. Pre-commit hook lints staged
        # files only; CI lints the whole tree to catch anything that
        # slipped through PRE_COMMIT_SKIP=1 or was committed pre-V7
        # when the hook's src/ glob was silently dead.
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: doctor:arch (architectural + silent-failure rules)
        run: bun run scripts/doctor-architecture.ts

      - name: smoke (boot + plugin dispatch + live-fire hook spawn)
        run: bun run smoke

  platform-smoke:
    name: platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build native standalone binary
        run: bun run build:standalone
      - name: Boot native standalone binary
        shell: bash
        run: |
          binary=$(find dist/binaries -maxdepth 1 -type f -name 'ccb-*' | head -1)
          test -n "$binary"
          "$binary" --version
