# Tag-driven release pipeline — DON'T add quality gates here.
#
# This file is byte-equal to v26.5.17 and shipped 17 releases cleanly.
# ci.yml + .githooks/pre-push gate every merge to main on macos. Tags
# are cut from main HEAD, so main is already gated. Adding test/
# doctor:arch/smoke here = first-time exposure to ubuntu-latest, which
# surfaces latent platform-specific bugs that block release for no
# benefit. See `feedback_release_pipeline_chase_root_causes.md` and
# the v26.5.18 series for the cautionary tale (~3h chasing a GHA-
# runner-specific Bun spawn race + cumulative stale-draft drift after
# 6 retags).
#
# If you think you need a quality gate here, the answer is: put it in
# ci.yml or pre-push. release.yml stays minimal.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.888)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build all platform binaries
        run: bun run build:platforms

      - name: Generate SHA256 checksums
        # Sibling .sha256 files alongside each binary. The auto-updater
        # fetches these to verify content integrity before symlink swap.
        run: |
          cd dist/binaries
          for f in ccb-*; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/binaries/ccb-darwin-arm64
            dist/binaries/ccb-darwin-arm64.sha256
            dist/binaries/ccb-darwin-x64
            dist/binaries/ccb-darwin-x64.sha256
            dist/binaries/ccb-linux-arm64
            dist/binaries/ccb-linux-arm64.sha256
            dist/binaries/ccb-linux-x64
            dist/binaries/ccb-linux-x64.sha256
            dist/binaries/ccb-windows-x64.exe
            dist/binaries/ccb-windows-x64.exe.sha256
