name: Nightly Drift Check

# Closes the pre-commit fast-subset gap. The pre-commit hook only runs ~8
# fast verifiers; the slow set (tsc-errors, silent-failure-ratchet,
# knip-headroom, deps-setters-wired, await-generator-misuse) only fires
# on pre-push. Drift can accumulate between full-suite runs.
#
# This workflow runs the FULL doctor:arch + smoke on origin/main daily.
# On failure, updates one sticky issue and fails the workflow. On recovery,
# closes that issue so GitHub reflects the current state rather than retaining
# an ambiguous false-green run or a stale alert.
#
# See feedback_pre_commit_fast_subset_gap.md.

on:
  schedule:
    # 00:00 UTC every day (= 08:00 HKT). Most pushes for the day are done.
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: doctor:arch (full)
        id: doctor
        run: bun run doctor:arch
        continue-on-error: true

      - name: smoke
        id: smoke
        run: bun run smoke
        continue-on-error: true

      - name: tests
        id: tests
        run: bun test
        continue-on-error: true

      - name: Detect drift
        id: drift
        if: steps.doctor.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          {
            echo "## Drift detected on origin/main"
            echo ""
            echo "Nightly check at $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC failed:"
            echo ""
            echo "- doctor:arch outcome: ${{ steps.doctor.outcome }}"
            echo "- smoke outcome: ${{ steps.smoke.outcome }}"
            echo "- tests outcome: ${{ steps.tests.outcome }}"
            echo ""
            echo "See the workflow run for full output:"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Per feedback_pre_commit_fast_subset_gap.md: drift can"
            echo "accumulate between developer pushes when the slow verifier"
            echo "set isn't run. Investigate which verifier dropped, decide"
            echo "whether to fix-or-bump-baseline, then commit on main."
          } > /tmp/drift-body.md

      - name: Open or update issue
        if: steps.doctor.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Nightly drift detected on origin/main'
          issue_number=$(gh issue list \
            --state open \
            --label automated \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" \
            | head -1)
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --body-file /tmp/drift-body.md
            gh issue comment "$issue_number" \
              --body "Updated from workflow run ${{ github.run_id }}."
          else
            gh issue create \
              --title "$title" \
              --body-file /tmp/drift-body.md \
              --label drift \
              --label automated
          fi

      - name: Close recovered drift issue
        if: steps.doctor.outcome == 'success' && steps.smoke.outcome == 'success' && steps.tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Nightly drift detected on origin/main'
          gh issue list \
            --state open \
            --label automated \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" \
            | while read -r issue_number; do
                [[ -n "$issue_number" ]] || continue
                gh issue close "$issue_number" \
                  --comment "Recovered in workflow run ${{ github.run_id }}; all nightly checks passed."
              done

      - name: Fail when drift was detected
        if: steps.doctor.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          echo "One or more nightly checks failed; the drift issue was updated."
          exit 1
