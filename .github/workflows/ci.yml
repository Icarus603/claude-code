name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: doctor:arch (architectural + silent-failure rules)
        run: bun run scripts/doctor-architecture.ts

      - name: smoke (boot + plugin dispatch + live-fire hook spawn)
        run: bun run smoke
